name: HamVPN Android APK

# Сборка тестовой APK ХамВПН. Запуск вручную: Actions -> HamVPN Android APK -> Run workflow
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      IS_GITHUB_ACTIONS: 1
      # prod = стабильная версия ядра из dependencies.properties (draft не совпадает с кодом)
      CHANNEL: prod
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare (deps, codegen, core libs)
        run: make android-apk-prepare

      - name: Build APK
        run: flutter build apk --release --target lib/main.dart --target-platform android-arm,android-arm64,android-x64

      - name: Collect APKs
        run: |
          mkdir -p out
          D=build/app/outputs/flutter-apk
          ls -la $D
          cp $D/app-arm64-v8a-release.apk   out/HamVPN-arm64.apk
          cp $D/app-armeabi-v7a-release.apk out/HamVPN-arm7.apk
          cp $D/app-x86_64-release.apk      out/HamVPN-x86_64.apk
          cp $D/app-release.apk             out/HamVPN-universal.apk
          ls -la out

      # Каждый вариант — отдельным файлом для скачивания
      - name: Upload arm64 (для большинства телефонов)
        uses: actions/upload-artifact@v6
        with:
          name: HamVPN-arm64
          path: out/HamVPN-arm64.apk
          compression-level: 0
          retention-days: 14

      - name: Upload arm7 (старые телефоны)
        uses: actions/upload-artifact@v6
        with:
          name: HamVPN-arm7
          path: out/HamVPN-arm7.apk
          compression-level: 0
          retention-days: 14

      - name: Upload universal (подходит всем, но большой)
        uses: actions/upload-artifact@v6
        with:
          name: HamVPN-universal
          path: out/HamVPN-universal.apk
          compression-level: 0
          retention-days: 14

      - name: Upload x86_64 (эмуляторы, Android-ТВ на x86)
        uses: actions/upload-artifact@v6
        with:
          name: HamVPN-x86_64
          path: out/HamVPN-x86_64.apk
          compression-level: 0
          retention-days: 14
